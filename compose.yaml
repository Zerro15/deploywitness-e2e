services:
  api:
    image: example/api
    depends_on: [db]
    networks: [isolated]
    labels:
      app: demo
  db:
    image: postgres:16
    networks: [backend]
    volumes: [db-data:/var/lib/postgresql/data]
  cache:
    image: redis:7
    networks: [backend]
volumes:
  db-data: {}
networks:
  backend: {}
  isolated: {}
x-deploywitness:
  required_network_links:
    - from: api
      to: db